name: 버그 제보
description: 잘못 동작하는 부분을 제보합니다.
title: "[Fix] "
labels: ["🐛bug", "👩🏻‍💻frontend"]
projects: ["JECT-Study/29"]
body:
  - type: textarea
    id: description
    attributes:
      label: 어떤 문제인가요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 발생 환경
      multiple: true
      options:
        - iOS 앱
        - Android 앱
        - 모바일 브라우저
        - PC 브라우저
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 / 로그
