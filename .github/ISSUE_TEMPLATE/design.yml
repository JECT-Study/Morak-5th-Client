name: 디자인
description: 화면·컴포넌트 디자인, 디자인 QA 등 PD 작업입니다.
title: "[Design] "
labels: ["🎨design"]
projects: ["JECT-Study/29"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 종류
      options:
        - 신규 화면
        - 화면 수정
        - 컴포넌트
        - 디자인 QA (구현 화면 검수)
        - 에셋 (아이콘·이미지·앱 아이콘)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 작업 내용
      description: 어떤 화면·컴포넌트인지, PRD의 어느 항목(F01~F05)과 연결되는지 적어주세요.
      placeholder: "예) F03 인증 피드 - 인증 사진 업로드 화면"
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: 작업할 화면
      description: 화면 단위로 나눠 적어주세요. FE는 이 목록을 기준으로 이슈를 나눕니다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: 넘기기 전 확인
      description: FE에 전달하기 전에 확인해주세요.
      options:
        - label: 빈 화면·로딩·에러 상태도 그렸다
        - label: JDS 컴포넌트를 썼고, 새로 만든 컴포넌트는 따로 표시했다
        - label: 모바일 기준(375px)으로 확인했다
        - label: 기획(PM)과 화면 흐름을 맞췄다
  - type: input
    id: figma
    attributes:
      label: 피그마 링크
      description: 작업할 프레임 링크를 넣어주세요.
  - type: input
    id: due
    attributes:
      label: 목표 일정
      placeholder: "예) 2026-10-31"
