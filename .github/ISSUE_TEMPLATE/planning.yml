name: 기획
description: 기능 정의, 정책, 화면 흐름, 일정 등 PM 작업입니다.
title: "[Plan] "
labels: ["📋planning"]
projects: ["JECT-Study/29"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 종류
      options:
        - 기능 정의
        - 정책 (규칙·예외 상황)
        - 화면 흐름
        - 일정·회의
        - QA (기획대로 동작하는지 검수)
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한지, PRD의 어느 항목(F01~F05)과 연결되는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 정해야 할 것
      description: 이 이슈에서 결정할 내용을 적어주세요. 결정되면 결과를 댓글로 남겨주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: parts
    attributes:
      label: 영향 받는 파트
      description: 결정되면 해당 파트에 알려주세요.
      options:
        - label: FE
        - label: BE
        - label: PD
  - type: input
    id: doc
    attributes:
      label: 문서 링크
      description: 노션 등 결과물 문서
  - type: input
    id: due
    attributes:
      label: 목표 일정
      placeholder: "예) 2026-10-31"
