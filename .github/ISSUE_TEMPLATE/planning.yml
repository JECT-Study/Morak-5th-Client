name: 기획
description: PM 작업 일정 공유용입니다. 만든 뒤 보드에서 Start date·Target date를 입력해주세요.
title: "[Plan] "
labels: ["📋planning"]
projects: ["JECT-Study/29"]
body:
  - type: dropdown
    id: feature
    attributes:
      label: 기능
      options:
        - F01 그룹 개설·신청·참여
        - F02 그룹 운영·채팅
        - F03 인증 피드·판정·달성률·참여 관리
        - F04 무료 포인트 획득·사용·정산
        - F05 프로필·모락이 캐릭터·완주 메달
        - 공통 (일정, 회의 등)
    validations:
      required: true
  - type: input
    id: doc
    attributes:
      label: 노션 링크
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 메모
      description: 개발에 미리 알려줄 내용이 있으면 적어주세요.
